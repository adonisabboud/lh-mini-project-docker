services:
  backend:
    build: .
    container_name: python-app-backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    name: app-net
    external: true